<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-labelledby="t d">
  <title id="t">Bescor MP101W Remote, TRRS cable and pan/tilt Head</title>
  <desc id="d">Illustration, not to scale: the handheld Remote with joystick and buttons, connected by a TRRS cable to the pan/tilt Head carrying a camera.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3647"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0a1626"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="456" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#cbd5e1">

    <!-- Remote -->
    <g filter="url(#shadow)">
      <rect x="70" y="120" width="130" height="270" rx="20" fill="url(#body)" stroke="#475569" stroke-width="2"/>
    </g>
    <rect x="96" y="104" width="78" height="22" rx="4" fill="#0f172a" stroke="#475569"/>
    <!-- TRRS jack on top of the Remote -->
    <circle cx="135" cy="115" r="5" fill="#020617" stroke="#94a3b8"/>
    <!-- speed LED row -->
    <g fill="#22d3ee">
      <circle cx="94" cy="148" r="3.5"/><circle cx="104" cy="148" r="3.5"/><circle cx="114" cy="148" r="3.5"/>
      <circle cx="124" cy="148" r="3.5"/><circle cx="134" cy="148" r="3.5"/><circle cx="144" cy="148" r="3.5"/>
      <circle cx="154" cy="148" r="3.5" fill="#164e63"/><circle cx="164" cy="148" r="3.5" fill="#164e63"/>
      <circle cx="174" cy="148" r="3.5" fill="#164e63"/>
    </g>
    <!-- speed buttons -->
    <rect x="88" y="168" width="26" height="18" rx="5" fill="#334155" stroke="#64748b"/>
    <rect x="156" y="168" width="26" height="18" rx="5" fill="#334155" stroke="#64748b"/>
    <text x="101" y="181" font-size="12" text-anchor="middle">&#8722;</text>
    <text x="169" y="181" font-size="12" text-anchor="middle">+</text>
    <!-- joystick -->
    <circle cx="135" cy="244" r="40" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="135" cy="244" r="26" fill="#1e293b" stroke="#64748b"/>
    <circle cx="135" cy="244" r="16" fill="#0b1220" stroke="#94a3b8"/>
    <g stroke="#475569" stroke-width="1.5" fill="none">
      <path d="M135,206 v-6 M135,288 v6 M97,244 h-6 M173,244 h6"/>
    </g>
    <!-- six buttons -->
    <g fill="#334155" stroke="#64748b">
      <rect x="86" y="308" width="30" height="20" rx="6"/><rect x="120" y="308" width="30" height="20" rx="6"/><rect x="154" y="308" width="30" height="20" rx="6"/>
      <rect x="86" y="340" width="30" height="20" rx="6"/><rect x="120" y="340" width="30" height="20" rx="6"/><rect x="154" y="340" width="30" height="20" rx="6"/>
    </g>
    <text x="135" y="412" font-size="15" text-anchor="middle" font-weight="600" fill="#e2e8f0">Remote</text>
    <text x="135" y="430" font-size="11" text-anchor="middle" fill="#94a3b8">joystick, speed, 0 / 45 / 90 / 340, spin</text>

    <!-- Cable -->
    <path d="M135,110 C135,20 400,10 470,190 S540,372 605,372" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <!-- TRRS plug -->
    <g transform="translate(596,372)">
      <rect x="-14" y="-9" width="22" height="18" rx="3" fill="#475569"/>
      <rect x="8" y="-5" width="30" height="10" fill="url(#metal)"/>
      <g fill="#0b1220"><rect x="14" y="-5" width="2.5" height="10"/><rect x="22" y="-5" width="2.5" height="10"/><rect x="30" y="-5" width="2.5" height="10"/></g>
    </g>
    <!-- cable label -->
    <g transform="translate(335,290)">
      <rect x="-90" y="-26" width="180" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="0" y="-6" font-size="13" text-anchor="middle" font-weight="600" fill="#fde68a">TRRS cable &#183; RS-485</text>
      <text x="0" y="12" font-size="11" text-anchor="middle" fill="#cbd5e1">Tip = GND &#183; Ring 1 = B &#183; Ring 2 = A</text>
      <text x="0" y="28" font-size="11" text-anchor="middle" fill="#cbd5e1">Sleeve = ~6 V &#183; 9600 8N1</text>
      <text x="0" y="43" font-size="11" text-anchor="middle" fill="#94a3b8">Remote talks, Head never replies</text>
    </g>

    <!-- Head -->
    <g filter="url(#shadow)">
      <rect x="605" y="336" width="240" height="56" rx="12" fill="url(#body)" stroke="#475569" stroke-width="2"/>
    </g>
    <ellipse cx="725" cy="336" rx="86" ry="12" fill="url(#metal)" stroke="#64748b"/>
    <!-- A/M switch -->
    <rect x="800" y="354" width="30" height="16" rx="3" fill="#0f172a" stroke="#64748b"/>
    <rect x="816" y="357" width="11" height="10" rx="2" fill="#38bdf8"/>
    <text x="808" y="383" font-size="9" text-anchor="middle" fill="#94a3b8">A | M</text>
    <!-- pan column -->
    <rect x="703" y="260" width="44" height="76" fill="url(#metal)" stroke="#64748b"/>
    <!-- yoke -->
    <rect x="636" y="252" width="178" height="16" rx="5" fill="url(#metal)" stroke="#64748b"/>
    <rect x="636" y="120" width="16" height="140" rx="5" fill="url(#metal)" stroke="#64748b"/>
    <rect x="798" y="120" width="16" height="140" rx="5" fill="url(#metal)" stroke="#64748b"/>
    <!-- camera -->
    <rect x="652" y="132" width="146" height="100" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="725" cy="182" r="34" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="725" cy="182" r="27" fill="url(#lens)"/>
    <circle cx="715" cy="172" r="6" fill="#e0f2fe" fill-opacity="0.55"/>
    <rect x="668" y="144" width="22" height="9" rx="2" fill="#334155"/>
    <circle cx="779" cy="150" r="4" fill="#ef4444"/>
    <!-- motion arrows -->
    <path d="M628,408 Q725,438 822,408" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="725" y="446" font-size="12" text-anchor="middle" fill="#7dd3fc">pan</text>
    <path d="M846,126 Q876,190 846,254" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="872" y="196" font-size="12" fill="#7dd3fc">tilt</text>
    <text x="725" y="104" font-size="15" text-anchor="middle" font-weight="600" fill="#e2e8f0">Head</text>
    <text x="725" y="120" font-size="11" text-anchor="middle" fill="#94a3b8">MP101W pan / tilt</text>

    <text x="888" y="22" font-size="10" text-anchor="end" fill="#64748b">Illustration, not to scale</text>
  </g>
</svg>
